name: Flutter Android APK Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$FLUTTER_ROOT" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
          elif [ -n "$FLUTTER_HOME" ]; then
            echo "flutter.sdk=$FLUTTER_HOME" >> local.properties
          fi
          cat local.properties
          cd ..

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Clean Flutter and Gradle
        run: |
          flutter clean
          cd android && ./gradlew clean && cd ..

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch isar_flutter_libs for AGP 8.7+ compatibility
        run: |
          ISAR_DIR=$(find $HOME/.pub-cache -path "*/isar_flutter_libs-*/android" -type d 2>/dev/null | head -1)
          if [ -n "$ISAR_DIR" ]; then
            echo "Patching isar_flutter_libs at $ISAR_DIR"
            # Remove package attribute from AndroidManifest.xml
            sed -i 's/package="dev.isar.isar_flutter_libs"//g' "$ISAR_DIR/src/main/AndroidManifest.xml"
            cat "$ISAR_DIR/src/main/AndroidManifest.xml"
            # Fix compileSdk in build.gradle
            if [ -f "$ISAR_DIR/build.gradle" ]; then
              sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' "$ISAR_DIR/build.gradle"
              sed -i 's/compileSdk .*/compileSdk = 35/g' "$ISAR_DIR/build.gradle"
              echo "--- patched build.gradle ---"
              cat "$ISAR_DIR/build.gradle"
            fi
          else
            echo "isar_flutter_libs not found, skipping patch"
          fi

      - name: Build Release APK 
        run: flutter build apk --release --no-tree-shake-icons --build-number=11 --build-name=1.0.8

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk-output
          path: build/app/outputs/flutter-apk/

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sahaj ERP Android Release (Latest APK)"
          body: "Official Sahaj ERP Android APK release. Direct download link available below."
          draft: false
          prerelease: false
          overwrite: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
