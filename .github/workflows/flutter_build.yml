name: Flutter Cloud Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Bundle
        run: flutter build web --release --base-href "/"

      - name: Commit build/web for Vercel Deployment
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-build web bundle for Vercel deployment"
          file_pattern: 'build/web/*'

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build APK (Split Per ABI)
        run: flutter build apk --split-per-abi

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sahaj-ERP-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sahaj ERP Android Release (Latest APK)"
          body: "Official Sahaj ERP Android APK release. Direct download link available below."
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
