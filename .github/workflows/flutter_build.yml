name: Flutter Android APK Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=11 --build-name=1.0.8

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sahaj ERP Android Release (Latest APK)"
          body: "Official Sahaj ERP Android APK release. Direct download link available below."
          draft: false
          prerelease: false
          overwrite: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
