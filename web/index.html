<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sahaj ERP Application">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="business_sahaj_erp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sahaj ERP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #1E293B 0%, #0F172A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: #FFFFFF;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366F1 0%, #3B82F6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-box svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
    }
    .app-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #F8FAFC;
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }
    .spinner-ring {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
  </style>
</head>
<body style="background-color: #0F172A;">
  <div id="loading-splash">
    <div class="logo-box">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </div>
    <div class="app-title">Business Sahaj ERP</div>
    <div class="app-subtitle">Loading Executive Suite...</div>
  </div>
  <script>
    (function() {
      function removeSplash() {
        const splash = document.getElementById('loading-splash');
        if (splash && splash.parentNode) {
          splash.style.transition = 'opacity 0.4s ease-out';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 450);
        }
      }

      const observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view, flt-glasspane, canvas')) {
          removeSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      const checkInterval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glasspane, canvas')) {
          removeSplash();
          clearInterval(checkInterval);
        }
      }, 150);

      setTimeout(function() {
        removeSplash();
        clearInterval(checkInterval);
        try { observer.disconnect(); } catch (_) {}
      }, 3000);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
